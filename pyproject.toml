[project]
name = "mousebat"
version = "0.1.0"
description = "Tray indicator for Logitech wireless mouse battery level (HID++)"
requires-python = ">=3.11"
dependencies = ["PyQt6"]

[project.scripts]
mousebat = "mousebat.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mousebat"]
